<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSE 412 Project</title>
  <style>

    body {
      margin: 0;
      font-family: monospace;
    }

    .top-bar {
      display: flex;
      width: 100%;
      background-color: #f5f5f5;
    }

    .search-bar {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .search-bar input[type="text"] {
      padding: 10px;
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 4px 0 0 4px;
      outline: none;
      font-family: monospace;
    }

    .search-bar button {
      padding: 10px 20px;
      border: 1px solid #ccc;
      border-left: none;
      background-color: #007bff;
      color: white;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
    }

    .search-bar button:hover {
      background-color: #0056b4;
    }

    .button-group {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .filter-wrapper {
        position: relative;
    }

    .filter-toggle {
        padding: 10px 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background-color: #f5f5f5;
        cursor: pointer;
    }

    .filter-menu {
        display: none;
        flex-direction: column;
        gap: 12px;
        position: absolute;
        top: 40px;
        right: 0;
        background-color: white;
        padding: 16px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        z-index: 10;
        width: 200px;
    }

    .filter-menu input[type="text"],
    .filter-menu input[list],
    .filter-menu select {
        width: 100%;               /* Fill the filter box width */
        height: 36px;              /* Consistent height */
        padding: 6px 10px;
        font-size: 14px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    .filter-wrapper.active .filter-menu {
        display: flex;
    }

    .filter-menu label {
        display: flex;
        flex-direction: column;
        font-size: 14px;
    }

    .nav-tab {
        display: flex;
        justify-content: start;
        gap: 10px;
        align-items: center;
        padding: 1em 1em 0 1em;
        background-color: #f1f1f1;
        width: 100;
    }

    .nav-tab > div {
        background: transparent;
        cursor: pointer;
        padding: 0.75em 1em 0.5em 1em;
        border-radius: 4px 4px 0px 0px;
        transition: background 0.3s ease;
    }

    .nav-tab > div.active {
        background: white;
    }

    .browser {
        background: #f1f1f1;
    }

    .browser > .content {
        padding: 0 1em;
        display: flex;
        flex-direction: column;
    }

    .browser > .content > div {
        background: white;
        display: none;
    }

    .browser > .content > div.active {
        display: grid;
        grid-template-columns: 1fr 1fr;
    }

    .browser > .content > div > .entry {
        padding: 1em;
        border: 2px dotted black;
        margin: 1em;
    }

    .entry > p {
        word-break: break-all;
    }
  </style>
  <style>
    @media (max-width: 768px) {
        .browser > .content > div.active {
            grid-template-columns: 1fr;
        }
        body {
            padding: 0 1em;
        }
    }
  </style>
  <script defer>
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelector('.filter-toggle').addEventListener('click', () => {
        document.querySelector('.filter-wrapper').classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
        const wrapper = document.querySelector('.filter-wrapper');
        if (!wrapper.contains(e.target)) {
            wrapper.classList.remove('active');
        }
        });


        const numTracks = document.getElementById("numTracks");

        for (let c = 1; c <= 32; c++) {
        const option = document.createElement("option");
        option.value = c;
        option.textContent = c;
        numTracks.appendChild(option);
        }

        const trackNum = document.getElementById("trackNum");

        for (let c = 1; c <= 32; c++) {
        const option = document.createElement("option");
        option.value = c;
        option.textContent = c;
        trackNum.appendChild(option);
        }

        const slider = document.getElementById("duration-slider");
        const label = document.getElementById("duration-label");

        function updateLabel(value) {
        const minutes = Math.floor(value / 60);
        const seconds = value % 60;
        label.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        // Initial value
        updateLabel(slider.value);

        slider.addEventListener("input", () => {
        updateLabel(slider.value);
        });

        const slider2 = document.getElementById('popularity-slider');
        const label2 = document.getElementById('popularity-value');

        slider2.addEventListener('input', () => {
          label2.textContent = slider2.value;
        });

        const slider3 = document.getElementById('bpm-slider');
        const label3 = document.getElementById('bpm-value');

        slider3.addEventListener('input', () => {
          label3.textContent = slider3.value;
        });

        // browser tab switcher
        document.querySelectorAll(".nav-tab > div").forEach((tab, index) => {
            console.log("Tab clicked");
            tab.addEventListener("click", () => {
                document.querySelectorAll(".nav-tab > div").forEach(t => t.classList.remove("active"));
                tab.classList.add("active");
                document.querySelectorAll(".browser > .content > div").forEach(b => b.classList.remove("active"));
                document.querySelectorAll(".browser > .content > div")[index].classList.add("active");
            });
        });

        // decides which filter to use
        document.querySelectorAll('.filter-toggle').forEach(button => {
          button.addEventListener('click', function () {
           const filterMenu = this.closest('.filter-wrapper').querySelector('.filter-menu');
           filterMenu.style.display = filterMenu.style.display === 'flex' ? 'none' : 'flex';
          });
  });
    })

  </script>
  <script defer>
  function secondsToDuration(seconds) {
    const minutes = Math.floor((seconds % 3600) / 60);
    const remainingSeconds = seconds % 60;

    return `${minutes}m ${remainingSeconds}s`;
  }

    fetch("/artists")
        .then(response => response.json())
        .then(data => {
        const artists = document.querySelector(".artists");
        data.forEach(entry => {
            const element = document.createElement("div");
            element.classList.add('entry');

            const name = document.createElement("h2");
            const link = document.createElement("a");
            link.textContent = entry.name;
            link.href = `/search/songs?artist=${entry.id}`;
            name.appendChild(link);
            element.appendChild(name);

            const bio = document.createElement("p");
            bio.textContent = entry.biography;
            element.appendChild(bio);

            const birthdate = document.createElement("p");
            birthdate.textContent = "Birthdate: " + new Date(entry.birthday).toLocaleString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
            element.appendChild(birthdate);

            const country = document.createElement("p");
            country.textContent = entry.country;
            element.appendChild(country);

            const popularity = document.createElement("p");
            popularity.textContent = `Popularity: ${entry.popularity}`;
            element.appendChild(popularity);

            artists.appendChild(element);
            });
        });
    fetch("/albums")
      .then(response => response.json())
      .then(data => {
        const albums = document.querySelector(".albums");
        data.forEach(entry => {
          const element = document.createElement("div");
          element.classList.add('entry');

          const name = document.createElement("h2");
          const link = document.createElement("a");
          link.textContent = entry.name;
          link.href = `/search/songs?album=${entry.id}`;
          name.appendChild(link);
          element.appendChild(name);

          const genre = document.createElement("p");
          genre.textContent = `Genre: ${entry.genre}`;
          element.appendChild(genre);

          const artists = document.createElement("p");
          artists.textContent = "Artists: "
          for (const a of entry.artists) {
              const artist = document.createElement("a");
              artist.textContent = a.name;
              artist.href = `/search/songs?artist=${a.id}`;
              artists.appendChild(artist);
              if (a !== entry.artists[entry.artists.length - 1]) {
                  artists.appendChild(document.createTextNode(", "));
              }
          }
          element.appendChild(artists);

          const record = document.createElement("p");
          record.textContent = `Record Label: ${entry.record_label.name}`;
          element.appendChild(record);

          const releaseDate = document.createElement("p");
          releaseDate.textContent = new Date(entry.release_date).toLocaleString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
          element.appendChild(releaseDate);

          albums.appendChild(element);
        });
      });
    fetch("/songs")
      .then(response => response.json())
      .then(data => {
        const songs = document.querySelector(".songs");
        data.forEach(entry => {
          const element = document.createElement("div");
          element.classList.add('entry');

          const title = document.createElement("h2");
          title.textContent = entry.name;
          element.appendChild(title);

          const genre = document.createElement("p");
          genre.textContent = "Genre: " + entry.genre;
          element.appendChild(genre);

          const album = document.createElement("p");
          album.textContent = "Album: ";
          const album_link = document.createElement("a");
          album_link.textContent = entry.album.name;
          album_link.href = `/search/songs?album=${entry.album.id}`;
          album.appendChild(album_link);
          element.appendChild(album);

          const artists = document.createElement("p");
          artists.textContent = "Artists: "
          for (const a of entry.artists) {
              const artist = document.createElement("a");
              artist.textContent = a.name;
              artist.href = `/search/songs?artist=${a.id}`;
              artists.appendChild(artist);
              if (a !== entry.artists[entry.artists.length - 1]) {
                  artists.appendChild(document.createTextNode(", "));
              }
          }
          element.appendChild(artists);

          const producers = document.createElement("p");
          for (const p of entry.producers) {
            producers.textContent += p.name + ", ";
          }
          producers.textContent = "Producers: " + producers.textContent.slice(0, -2);
          element.appendChild(producers);

          const writers = document.createElement("p");
          for (const w of entry.writers) {
            writers.textContent += w.name + ", ";
          }
          writers.textContent = "Writers: " + writers.textContent.slice(0, -2);
          element.appendChild(writers);

          const record = document.createElement("p");
          record.textContent = `Record Label: ${entry.record_label.name}`;
          element.appendChild(record);

          const releaseDate = document.createElement("p");
          releaseDate.textContent = "Release Date: " + new Date(entry.release_date).toLocaleString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
          element.appendChild(releaseDate);

          const duration = document.createElement("p");
          duration.textContent = "Duration: " +  secondsToDuration(entry.duration);
          element.appendChild(duration);

          const details = document.createElement("p");
          details.textContent = `BPM: ${entry.bpm} -- Key: ${entry.key}`;
          element.appendChild(details);

          songs.appendChild(element);
        });
      });
  </script>
</head>
<body>

 
  <div class="browser">
      <div class="nav-tab">
          <div class="active">Artists</div>
          <div>Albums</div>
          <div>Songs</div>
      </div>
      <div class="content">
          <div class="artists active">
            <div class="search-container">
              <form class="search-bar" action="/search" method="GET">
                <input type="text" name="query" placeholder="Search for artists">
                <button type="submit">Go</button>
          
                <div class="filter-wrapper">
                  <button class="filter-toggle" type="button">Filter ▾</button>
                  <div class="filter-menu">
          
                    <label for="country">Country:</label>
                    <input type="text" id="country" name="country" placeHolder="enter here"
          
                    <label for="birthYear">Birth Year:</label>
                    <input type="text" id="birthYear" name="birthYear" placeHolder="enter here"
          
                    <label>
                      Popularity:
                      <select name="more or less">
                        <option value="">Greater Than</option>
                        <option value="exactly">Exactly</option>
                        <option value="shorter than">Shorter Than</option>
                      </select>
                      <input type="range" name="popularity-slider" id="popularity-slider" min="0" max="100" value="50">
                      <span id="popularity-value">50</span>
                    </label>
                  </div>
               </div>
              </form>
            </div>
          </div>
          <div class="albums">

            <div class="search-container">
              <form class="search-bar" action="/search" method="GET">
                <input type="text" name="query" placeholder="Search for albums">
                <button type="submit">Go</button>
          
                <div class="filter-wrapper">
                  <button class="filter-toggle" type="button">Filter ▾</button>
                  <div class="filter-menu">
          
                    <label>
                     Genre:
                      <select name="genre">
                        <option value="">Any</option>
                        <option value="blues">Blues</option>
                        <option value="country">Country</option>
                        <option value="hip-hop">Hip-Hop</option>
                        <option value="house">House</option>
                        <option value="jazz">Jazz</option>
                        <option value="metal">Metal</option>
                        <option value="pop">Pop</option>
                        <option value="rap">Rap</option>
                        <option value="rock">Rock</option>
                      </select>
                    </label>

                    <label>
                      Album Type:
                       <select name="albumType">
                         <option value="">Any</option>
                         <option value="single">Single</option>
                         <option value="album">Album</option>
                       </select>
                     </label>

                    <label>
                    <label for="numTracks"># of Songs:</label>
                    <select id="numTracks" name="numTracks">
                      <option value="">Any</option>
                    </select>
                    <select name="more or less">
                      <option value="">Greater Than</option>
                      <option value="exactly">Exactly</option>
                      <option value="shorter than">Shorter Than</option>
                    </select>
                   </label> 
          
                    <label for="releaseYear">Release Year:</label>
                    <input type="text" id="releaseYear" name="releaseYear" placeHolder="enter here"
          
                    <label for="recordLabel">Record Label:</label>
                    <input type="text" id="recordLabel" name="recordLabel" placeHolder="enter here"
          
                    <label>
                  </div>
               </div>
              </form>
            </div>

          </div>
          <div class="songs">

            <div class="search-container">
              <form class="search-bar" action="/search" method="GET">
                <input type="text" name="query" placeholder="Search for songs">
                <button type="submit">Go</button>
          
                <div class="filter-wrapper">
                  <button class="filter-toggle" type="button">Filter ▾</button>
                  <div class="filter-menu">
                    <label>

                      <label>
                        Genre:
                         <select name="genre">
                           <option value="">Any</option>
                           <option value="blues">Blues</option>
                           <option value="country">Country</option>
                           <option value="hip-hop">Hip-Hop</option>
                           <option value="house">House</option>
                           <option value="jazz">Jazz</option>
                           <option value="metal">Metal</option>
                           <option value="pop">Pop</option>
                           <option value="rap">Rap</option>
                           <option value="rock">Rock</option>
                         </select>
                       </label>
             
                       <label for="releaseYear">Release Year:</label>
                       <input type="text" id="releaseYear" name="releaseYear" placeHolder="enter here"

                       <label for="albumName">Album Name:</label>
                       <input type="text" id="albumName" name="albumName" placeHolder="enter here"

                       <label>
                        <label for="trackNum">Track #:</label>
                        <select id="trackNum" name="trackNum">
                          <option value="">Any</option>
                        </select>
                       </label> 

                       <label for="lyrics">Lyrics:</label>
                       <input type="text" id="lyrics" name="lyrics" placeHolder="enter here"
             
                       <label for="recordLabel">Record Label:</label>
                       <input type="text" id="recordLabel" name="recordLabel" placeHolder="enter here"
          
                    <label for="producer">Producer:</label>
                    <input type="text" id="producer" name="producer" placeHolder="enter here"
          
                    <label for="writer">Writer:</label>
                    <input type="text" id="writer" name="writer" placeHolder="enter here"

                    <label>
                      Key:
                       <select name="key">
                         <option value="">Any</option>
                         <option value="a">A</option>

                         <option value="f">F</option>

                       </select>
                     </label>

                    <label>
                      Duration:
                      <select name="more or less">

                        <option value="shorter than">Shorter Than</option>
                      </select>
                      <input type="range" name="duration" id="duration-slider" min="0" max="600" value="0">
                      <span id="duration-label">0:00</span>
                    </label>

                    <label>
                      BPM:
                      <select name="more or less">
                        <option value="">Greater Than</option>

                      </select>
                      <label for="bpm-slider">Value:</label>
                      <input type="range" name="bpm-slider" id="bpm-slider" min="60" max="200" value="60">

            </div>

          </div>

  </div>
</body>
