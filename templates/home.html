<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Centered Search Bar</title>
  <style>
    .top-bar {
      display: flex;
      background-color: #f5f5f5;
    }

    .search-bar {
      display: flex;
      justify-content: center;
    }

    .search-bar input[type="text"] {
      padding: 10px;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 4px 0 0 4px;
      outline: none;
    }

    .search-bar button {
      padding: 10px 20px;
      border: 1px solid #ccc;
      border-left: none;
      background-color: #007bff;
      color: white;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
    }

    .search-bar button:hover {
      background-color: #0056b4;
    }

    .filter-wrapper {
    position: relative;
  }

  .filter-toggle {
    padding: 10px 16px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background-color: #f5f5f5;
    cursor: pointer;
  }

  .filter-menu {
    display: none;
    flex-direction: column;
    gap: 12px;
    position: absolute;
    top: 40px;
    right: 0;
    background-color: white;
    padding: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    z-index: 10;
    width: 200px;
  }

  .filter-menu input[type="text"],
  .filter-menu input[list],
  .filter-menu select {
    width: 100%;               /* Fill the filter box width */
    height: 36px;              /* Consistent height */
    padding: 6px 10px;
    font-size: 14px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
  }

  .filter-wrapper.active .filter-menu {
    display: flex;
  }

  .filter-menu label {
    display: flex;
    flex-direction: column;
    font-size: 14px;
  }
  </style>
</head>
<body>

  <div class="search-container">
    <form class="search-bar" action="/search" method="GET">
      <input type="text" name="query" placeholder="Search for artists, albums, songs, & more">
      <button type="submit">Go</button>
    
      <div class="filter-wrapper">
        <button class="filter-toggle" type="button">Filter ▾</button>
        <div class="filter-menu">
          <label>
            Category:
            <select name="category">
             <option value="">Any</option>
              <option value="title">Title</option>
              <option value="artist">Artist</option>
              <option value="album">Album</option>
            </select>
          </label>
  
          <label>
           Genre:
            <select name="genre">
              <option value="">Any</option>
              <option value="pop">Pop</option>
              <option value="rock">Rock</option>
              <option value="jazz">Jazz</option>
            </select>
          </label>
  
          <label for="producer">Producer:</label>
          <input type="text" id="producer" name="producer" placeHolder="enter here"

          <label for="writer">Writer:</label>
          <input type="text" id="writer" name="writer" placeHolder="enter here"

          <label for="label">Label:</label>
          <input type="text" id="label" name="label" placeHolder="enter here"

          <label for="releaseYear">Release Year:</label>
          <select id="releaseYear" name="year">
            <option value="">Any</option>
          </select>

          <label>
            Duration:
            <select name="more or less">
              <option value="">Longer Than</option>
              <option value="shorter than">Shorter Than</option>
            </select>
            <input type="range" name="duration" id="duration-slider" min="0" max="600" value="0">
            <span id="duration-label">0:00</span>
          </label>
        </div>
     </div>
    </form>
  </div>

  <script>
    document.querySelector('.filter-toggle').addEventListener('click', () => {
      document.querySelector('.filter-wrapper').classList.toggle('active');
    });
  
    document.addEventListener('click', (e) => {
      const wrapper = document.querySelector('.filter-wrapper');
      if (!wrapper.contains(e.target)) {
        wrapper.classList.remove('active');
      }
    });
    
    const releaseYear = document.getElementById("releaseYear");
    const currentYear = new Date().getFullYear();

    for (let year = currentYear; year >= 1930; year--) {
     const option = document.createElement("option");
     option.value = year;
     option.textContent = year;
     releaseYear.appendChild(option);
   }

    const slider = document.getElementById("duration-slider");
    const label = document.getElementById("duration-label");

    function updateLabel(value) {
      const minutes = Math.floor(value / 60);
      const seconds = value % 60;
      label.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
    }

    // Initial value
    updateLabel(slider.value);

    slider.addEventListener("input", () => {
      updateLabel(slider.value);
    });
    
  </script>

</body>
</html>
